<li class="list-group-item d-flex justify-content-between align-items-center">
  <a href="{% url 'teams:team_detail' team.id %}">{{ team.name }}</a>
  <span>
    {% if team.is_registered %}
      <span class="badge bg-success me-2">зарегистрирована</span>
    {% else %}
      <span class="badge bg-secondary me-2">отменена</span>
    {% endif %}
    {{ team.participants|length }} участн.
  </span>
</li>
